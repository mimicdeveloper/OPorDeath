<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7ebf0"/>
      <stop offset="1" stop-color="#878d97"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a4d"/>
      <stop offset="55%" stop-color="#d3201b"/>
      <stop offset="100%" stop-color="#6e0a08"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- crossed cutlasses behind the skull -->
  <g stroke="#2b2f36" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(45 120 124)">
      <polygon points="120,24 126,150 114,150" fill="url(#blade)"/>
      <rect x="102" y="150" width="36" height="9" rx="2" fill="#e0b04a"/>
      <rect x="115" y="159" width="10" height="28" rx="3" fill="#3a2a18"/>
      <circle cx="120" cy="190" r="7" fill="#e0b04a"/>
    </g>
    <g transform="rotate(-45 120 124)">
      <polygon points="120,24 126,150 114,150" fill="url(#blade)"/>
      <rect x="102" y="150" width="36" height="9" rx="2" fill="#e0b04a"/>
      <rect x="115" y="159" width="10" height="28" rx="3" fill="#3a2a18"/>
      <circle cx="120" cy="190" r="7" fill="#e0b04a"/>
    </g>
  </g>

  <!-- skull -->
  <path fill="#f4eede" stroke="#1a1c20" stroke-width="4" stroke-linejoin="round"
        d="M120 70 C86 70 68 96 68 124 C68 142 76 153 86 160 L84 178 L100 176
           C104 184 111 188 120 188 C129 188 136 184 140 176 L156 178 L154 160
           C164 153 172 142 172 124 C172 96 154 70 120 70 Z"/>
  <!-- cheek hollows -->
  <path d="M86 150 q10 8 22 6 M154 150 q-10 8 -22 6" stroke="#cdbfa0" stroke-width="3" fill="none"/>
  <!-- glowing eyes -->
  <g filter="url(#glow)">
    <path d="M88 120 l28 6 -4 22 q-18 2 -26 -10 z" fill="url(#eye)"/>
    <path d="M152 120 l-28 6 4 22 q18 2 26 -10 z" fill="url(#eye)"/>
  </g>
  <!-- nose -->
  <path d="M120 140 l-8 16 h16 z" fill="#1a1c20"/>
  <!-- jagged teeth -->
  <g fill="#1a1c20">
    <path d="M104 174 l4 12 4 -12 4 12 4 -12 4 12 4 -12 4 12 4 -12 v-4 h-36 z"/>
  </g>

  <!-- straw hat -->
  <g stroke="#6e4112" stroke-width="4">
    <ellipse cx="120" cy="78" rx="82" ry="23" fill="#edbb52"/>
    <path d="M84 77 C84 47 100 37 120 37 C140 37 156 47 156 77 Z" fill="#f0c869"/>
  </g>
  <rect x="84" y="65" width="72" height="14" rx="3" fill="#cf2e2a"/>
</svg>
