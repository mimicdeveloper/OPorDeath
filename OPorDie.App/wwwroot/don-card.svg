<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 490" width="350" height="490">
  <defs>
    <clipPath id="card-clip">
      <rect x="6" y="6" width="338" height="478" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- Card border -->
  <rect x="2" y="2" width="346" height="486" rx="20" ry="20" fill="#111" stroke="#000" stroke-width="4"/>

  <!-- White card face -->
  <rect x="6" y="6" width="338" height="478" rx="18" ry="18" fill="#fff" clip-path="url(#card-clip)"/>

  <!-- Speed lines radiating from center -->
  <g clip-path="url(#card-clip)" opacity="0.18">
    <!-- Many thin radiating lines -->
    <line x1="175" y1="220" x2="175" y2="-10" stroke="#000" stroke-width="1.2"/>
    <line x1="175" y1="220" x2="340" y2="-10" stroke="#000" stroke-width="1"/>
    <line x1="175" y1="220" x2="380" y2="50" stroke="#000" stroke-width="1.2"/>
    <line x1="175" y1="220" x2="400" y2="130" stroke="#000" stroke-width="1"/>
    <line x1="175" y1="220" x2="390" y2="220" stroke="#000" stroke-width="1.2"/>
    <line x1="175" y1="220" x2="380" y2="320" stroke="#000" stroke-width="1"/>
    <line x1="175" y1="220" x2="340" y2="420" stroke="#000" stroke-width="1.2"/>
    <line x1="175" y1="220" x2="250" y2="500" stroke="#000" stroke-width="1"/>
    <line x1="175" y1="220" x2="175" y2="500" stroke="#000" stroke-width="1.2"/>
    <line x1="175" y1="220" x2="80" y2="500" stroke="#000" stroke-width="1"/>
    <line x1="175" y1="220" x2="-20" y2="420" stroke="#000" stroke-width="1.2"/>
    <line x1="175" y1="220" x2="-50" y2="320" stroke="#000" stroke-width="1"/>
    <line x1="175" y1="220" x2="-50" y2="220" stroke="#000" stroke-width="1.2"/>
    <line x1="175" y1="220" x2="-30" y2="120" stroke="#000" stroke-width="1"/>
    <line x1="175" y1="220" x2="10" y2="30" stroke="#000" stroke-width="1.2"/>
    <line x1="175" y1="220" x2="90" y2="-10" stroke="#000" stroke-width="1"/>
    <!-- Extra intermediate lines -->
    <line x1="175" y1="220" x2="290" y2="-10" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="370" y2="80" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="395" y2="175" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="370" y2="275" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="310" y2="460" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="210" y2="500" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="130" y2="500" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="40" y2="460" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="-30" y2="370" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="-50" y2="270" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="-40" y2="160" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="-10" y2="60" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="50" y2="10" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="140" y2="-10" stroke="#000" stroke-width="0.8"/>
    <line x1="175" y1="220" x2="220" y2="-10" stroke="#000" stroke-width="0.8"/>
  </g>

  <!-- Thick dramatic speed lines (darker) -->
  <g clip-path="url(#card-clip)" opacity="0.55">
    <line x1="175" y1="220" x2="175" y2="-10" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="410" y2="130" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="395" y2="220" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="390" y2="320" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="175" y2="500" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="-50" y2="320" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="-55" y2="220" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="-30" y2="100" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="60" y2="-10" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="290" y2="-10" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="380" y2="50" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="-20" y2="50" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="-10" y2="380" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="60" y2="500" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="300" y2="500" stroke="#000" stroke-width="5"/>
    <line x1="175" y1="220" x2="380" y2="400" stroke="#000" stroke-width="5"/>
  </g>

  <!-- White radial glow at center to sell the burst effect -->
  <radialGradient id="burst" cx="50%" cy="45%" r="35%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="175" cy="220" rx="90" ry="80" fill="url(#burst)" clip-path="url(#card-clip)"/>

  <!-- Main DON!! katakana text: ドン!! -->
  <text x="175" y="285"
        font-family="'Arial Black','Impact','sans-serif'"
        font-size="195"
        font-weight="900"
        text-anchor="middle"
        fill="#000"
        letter-spacing="-8"
        clip-path="url(#card-clip)">ドン!!</text>

  <!-- Super Pre-Release label -->
  <text x="28" y="378"
        font-family="Arial Black, Impact, sans-serif"
        font-size="18"
        font-weight="900"
        font-style="italic"
        fill="#e8c000"
        stroke="#7a5c00"
        stroke-width="0.5">Super Pre-Release</text>

  <!-- DON!! CARD small label -->
  <text x="28" y="394"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="700"
        fill="#333"
        letter-spacing="3">DON!! CARD</text>

  <!-- Bottom black bar -->
  <rect x="6" y="408" width="338" height="76" rx="0" fill="#111" clip-path="url(#card-clip)"/>

  <!-- Your Turn +1000 -->
  <text x="175" y="457"
        font-family="Arial Black, Impact, sans-serif"
        font-size="32"
        font-weight="900"
        text-anchor="middle"
        fill="#fff">Your Turn  +1000</text>
</svg>
